<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Archivist Capture - Options</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; margin: 24px; }
      label { display: block; margin-top: 12px; font-weight: 600; }
      input, textarea { width: 100%; padding: 8px; font-size: 14px; }
      .row { margin-top: 16px; display: flex; gap: 12px; }
      button { padding: 10px 14px; font-size: 14px; cursor: pointer; }
      .hint { color: #555; font-size: 13px; }
      .ok { color: #0a7; }
      .err { color: #c00; }
    </style>
  </head>
  <body>
    <h1>Archivist Capture - Options</h1>

    <label>Ingest URL</label>
    <input id="ingestUrl" placeholder="http://127.0.0.1:17373/capture" />

    <label>Bearer Token</label>
    <input id="token" placeholder="Paste token from the Archivist app" />

    <label>Capture delay (ms)</label>
    <input id="delayMs" type="number" min="0" step="100" />

    <label>Denylist (one host per line)</label>
    <textarea id="denylist" rows="8" placeholder="mail.google.com&#10;accounts.google.com"></textarea>
    <div class="hint">If the page hostname matches any line, Archivist Capture will skip sending.</div>

    <div class="row">
      <button id="save">Save</button>
      <button id="test">Test connection</button>
      <span id="status" class="hint"></span>
    </div>

    <script src="options.js"></script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Archivist Capture - Options</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; margin: 24px; }
      label { display: block; margin-top: 12px; font-weight: 600; }
      input[type="text"], input[type="number"], input[type="password"], textarea {
        width: 100%; padding: 8px; font-size: 14px; box-sizing: border-box;
      }
      .row { margin-top: 16px; display: flex; gap: 12px; }
      button { padding: 10px 14px; font-size: 14px; cursor: pointer; }
      .hint { color: #555; font-size: 13px; }
      .ok { color: #0a7; }
      .err { color: #c00; }
      .filter-section { margin-top: 16px; }
      .filter-section > label { margin-top: 0; }
      .radio-group { display: flex; gap: 16px; margin: 8px 0; }
      .radio-label { display: flex; align-items: center; gap: 4px; font-weight: normal; cursor: pointer; margin-top: 0; }
    </style>
  </head>
  <body>
    <h1>Archivist Capture - Options</h1>

    <label>Ingest URL</label>
    <input id="ingestUrl" type="text" placeholder="http://127.0.0.1:17373/capture" />

    <label>Bearer Token</label>
    <input id="token" type="password" placeholder="Paste token from the Archivist app" />

    <label>Capture delay (ms)</label>
    <input id="delayMs" type="number" min="0" step="100" />

    <div class="filter-section">
      <label>Domain filter</label>
      <div class="radio-group">
        <label class="radio-label">
          <input type="radio" name="filterMode" value="allowlist" checked />
          Allowlist — only capture these domains
        </label>
        <label class="radio-label">
          <input type="radio" name="filterMode" value="denylist" />
          Denylist — skip these domains
        </label>
      </div>
      <textarea id="domainList" rows="8" placeholder="mail.google.com&#10;accounts.google.com"></textarea>
      <div id="domainListHint" class="hint">Only pages whose hostname matches a line below will be captured.</div>
    </div>

    <div class="row">
      <button id="save">Save</button>
      <button id="test">Test connection</button>
      <span id="status" class="hint"></span>
    </div>

    <script src="options.js"></script>
  </body>
</html>

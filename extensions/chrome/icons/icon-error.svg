<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e1a1a"/>
      <stop offset="100%" stop-color="#3e1616"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="100%" stop-color="#cc0000"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe0e0"/>
      <stop offset="100%" stop-color="#fec7c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#cc0000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <g opacity="0.06" stroke="#ff4444" stroke-width="1" fill="none">
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="112" y="160" width="288" height="230" rx="20" fill="url(#bg)" stroke="url(#glow)" stroke-width="3"/>
    <path d="M100 175 Q100 140 135 140 L377 140 Q412 140 412 175 L412 185 Q412 195 400 195 L112 195 Q100 195 100 185 Z"
          fill="url(#bg)" stroke="url(#glow)" stroke-width="3"/>
  </g>

  <g opacity="0.9">
    <rect x="148" y="220" width="216" height="140" rx="6" fill="url(#page)" opacity="0.3" transform="rotate(-2 256 290)"/>
    <rect x="148" y="220" width="216" height="140" rx="6" fill="url(#page)" opacity="0.5" transform="rotate(1 256 290)"/>
    <rect x="148" y="220" width="216" height="140" rx="6" fill="url(#page)" opacity="0.85"/>

    <rect x="168" y="242" width="140" height="6" rx="3" fill="#cc3333" opacity="0.6"/>
    <rect x="168" y="258" width="176" height="5" rx="2.5" fill="#b08080" opacity="0.5"/>
    <rect x="168" y="271" width="160" height="5" rx="2.5" fill="#b08080" opacity="0.4"/>
    <rect x="168" y="284" width="170" height="5" rx="2.5" fill="#b08080" opacity="0.35"/>
    <rect x="168" y="297" width="120" height="5" rx="2.5" fill="#b08080" opacity="0.3"/>
  </g>

  <!-- X mark instead of arrow -->
  <g stroke="url(#glow)" stroke-width="8" stroke-linecap="round">
    <line x1="232" y1="80" x2="280" y2="128"/>
    <line x1="280" y1="80" x2="232" y2="128"/>
  </g>

  <circle cx="138" cy="405" r="4" fill="#ff4444" opacity="0.6"/>
  <circle cx="374" cy="405" r="4" fill="#cc0000" opacity="0.6"/>
</svg>
